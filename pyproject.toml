[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lofi-pomodoro"
version = "0.1.2"
authors = [
    { name = "WittmannF" }
]
description = "A CLI Pomodoro timer with lofi music"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
keywords = ["pomodoro", "timer", "productivity", "lofi", "music"]
dependencies = [
    "rich>=10.0.0",
    "pygame-ce>=2.5.8",
    "numpy>=1.21.0",
    "pynput",
    "psutil>=5.9.0",
    "platformdirs>=4.0.0",
    "truststore>=0.10.0",
    "spotipy>=2.24.0",
]

[project.optional-dependencies]
# scripts/scrape_songs.py and scripts/scrape_fma.py
scrape = ["requests", "beautifulsoup4"]
# scripts/download_youtube.py (also requires ffmpeg system binary)
youtube = ["yt-dlp"]
# scripts/fix_id3_tags.py
id3 = ["eyed3"]
# scripts/generate_music.py
elevenlabs = ["elevenlabs>=1.0", "pyyaml"]
# all optional script deps at once
scripts = ["requests", "beautifulsoup4", "yt-dlp", "eyed3", "elevenlabs>=1.0", "pyyaml"]

[project.urls]
Homepage = "https://github.com/WittmannF/lofi-pomodoro"
Repository = "https://github.com/WittmannF/lofi-pomodoro.git"
"Bug Tracker" = "https://github.com/WittmannF/lofi-pomodoro/issues"

[project.scripts]
pomodoro = "pomodoro.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pomodoro"]
exclude = [
    "pomodoro/default-playlist/**",
    "pomodoro/songs-with-error/**",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "pomodoro",
    "pomodoro/break-sounds",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "pomodoro/default-playlist/**",
    "pomodoro/songs-with-error/**",
]

[tool.hatch.build.targets.sdist.force-include]
"pomodoro/break-sounds" = "pomodoro/break-sounds"
